 <h1>Course Proposal</h1>

<main>
    <h1>Course Proposal Application</h1>
        <form method="get" action="Thanks.html" class="wf1">
            <fieldset>
                <legend>Applicant Information</legend>
                <label>first name: <input type="text" name="fname" required></label>
                <label>Last name: <input type="text" name="lname" required></label>
                <label>Phone: <input type="tel" name="phone" placeholder="123456783"></label>
                <label>Email: <input type="email" name="email" placeholder="...@...com"></label>
                <label>Website: <input type="url" name="url" placeholder="http://"></label>
            </fieldset>
            <fieldset>
                <legend>Course Information</legend>
                <div>Audience</div>
                <label><input type="radio" name="audience1">Beginner</label>
                <label><input type="radio" name="audience2">intermediate</label>
                <label><input type="radio" name="audience3">Advanced</label>
            <div>Software Needed</div>
                <label><input type="checkbox" name="editing" value="yes">Photo Editing</label>
                <label><input type="checkbox" name="code" value="yes">Coding</label>
                <label><input type="checkbox" name="process" value="yes">Processor</label>
                <label><input type="checkbox" name="client" value="yes">FTP Clients</label>
            </fieldset>
            <fieldset>
                <legend>Funding</legend>
                <label>Anticipated Completion Date <input type="date" name="complete"></label>
                <label>Course Subject
                    <select name="subject">
                        <option value="">Please Select</option>
                    <option value="software">Software</option>
                    <option value="business">Business</option>
                    <option value="english">English</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="french">French</option>
                    <option value="physics">Physics</option>
                    <option value="social">Social Studies</option>

                    </select>

                </label>
                <label>How Many Authors<input type="number" name="authors"></label>

            </fieldset>
            <input type="button" value="propose my course">

        </form>

          
        
    </main>
