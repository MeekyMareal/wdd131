<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="wwr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#wwr-bg)" />

  <!-- Mountain Silhouettes -->
  <path d="M40 260 L140 130 L230 240 L340 100 L470 270 L560 170 L600 230 L600 380 L0 380 L0 280 Z" fill="#0c4a6e" opacity="0.6"/>
  <path d="M0 290 L100 190 L190 290 L290 170 L420 310 L520 220 L600 300 L600 380 L0 380 Z" fill="#082f49" opacity="0.8"/>

  <!-- Water Waves -->
  <path d="M0 290 C 80 270, 140 310, 220 290 C 300 270, 360 310, 440 290 C 520 270, 560 300, 600 285 L600 380 L0 380 Z" fill="url(#river)" opacity="0.85"/>
  <path d="M0 320 C 100 305, 170 335, 260 315 C 350 295, 410 330, 500 315 C 550 305, 580 320, 600 315 L600 380 L0 380 Z" fill="#0284c7"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(50, 40)" filter="url(#shadow)">
    <!-- Browser Frame -->
    <rect width="500" height="260" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="500" height="32" rx="10" fill="#0f172a" />
    <!-- Browser Dots -->
    <circle cx="20" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="16" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="16" r="4.5" fill="#10b981" />
    <!-- URL Bar -->
    <rect x="75" y="8" width="310" height="16" rx="6" fill="#1e293b" />
    <text x="88" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">https://meekymareal.github.io/wdd130/wwr/</text>
    
    <!-- Hero Mockup inside Browser -->
    <rect x="15" y="44" width="470" height="95" rx="6" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="32" y="75" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="16">Dry Oar River Rafting Adventures</text>
    <text x="32" y="94" fill="#bae6fd" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Experience the Thrill • HTML5 &amp; CSS3 Layout</text>
    <rect x="32" y="106" width="95" height="20" rx="4" fill="#0284c7" />
    <text x="45" y="120" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold">Explore Trips</text>

    <!-- 3 Mini Content Cards -->
    <rect x="15" y="150" width="146" height="85" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="35" cy="172" r="10" fill="#0369a1" />
    <text x="52" y="176" fill="#f8fafc" font-size="11" font-weight="600" font-family="sans-serif">Rapid Tours</text>
    <rect x="25" y="192" width="125" height="5" rx="2" fill="#475569" />
    <rect x="25" y="202" width="90" height="5" rx="2" fill="#334155" />

    <rect x="177" y="150" width="146" height="85" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="197" cy="172" r="10" fill="#0284c7" />
    <text x="214" y="176" fill="#f8fafc" font-size="11" font-weight="600" font-family="sans-serif">River Guides</text>
    <rect x="187" y="192" width="125" height="5" rx="2" fill="#475569" />
    <rect x="187" y="202" width="80" height="5" rx="2" fill="#334155" />

    <rect x="339" y="150" width="146" height="85" rx="6" fill="#0f172a" stroke="#334155" />
    <circle cx="359" cy="172" r="10" fill="#38bdf8" />
    <text x="376" y="176" fill="#f8fafc" font-size="11" font-weight="600" font-family="sans-serif">Book Online</text>
    <rect x="349" y="192" width="125" height="5" rx="2" fill="#475569" />
    <rect x="349" y="202" width="100" height="5" rx="2" fill="#334155" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(435, 335)">
    <rect width="135" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#38bdf8"/>
    <text x="27" y="17" fill="#f0f9ff" font-family="sans-serif" font-size="10" font-weight="600">BYU WDD130 Project</text>
  </g>
</svg>
