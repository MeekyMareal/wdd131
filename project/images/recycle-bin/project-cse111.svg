<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cse111-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#cse111-bg)" />

  <!-- Code Terminal Window -->
  <g transform="translate(45, 35)" filter="url(#shadow3)">
    <rect width="510" height="270" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="510" height="32" rx="10" fill="#020617"/>
    <circle cx="20" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="16" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="16" r="4.5" fill="#10b981" />
    <text x="75" y="20" fill="#94a3b8" font-family="monospace" font-size="10">pytest test_chemistry.py • Python 3.11</text>

    <!-- Terminal Inner Split View -->
    <!-- Left: Python Code -->
    <rect x="15" y="44" width="245" height="212" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="25" y="62" fill="#64748b" font-family="monospace" font-size="8.5"># chemistry_calculator.py</text>
    <text x="25" y="80" fill="#38bdf8" font-family="monospace" font-size="9">def <tspan fill="#facc15">compute_molar_mass</tspan><tspan fill="#e2e8f0">(formula):</tspan></text>
    <text x="35" y="96" fill="#94a3b8" font-family="monospace" font-size="8.5">table = make_periodic_table()</text>
    <text x="35" y="112" fill="#94a3b8" font-family="monospace" font-size="8.5">total_mass = 0.0</text>
    <text x="35" y="128" fill="#c084fc" font-family="monospace" font-size="8.5">for <tspan fill="#e2e8f0">symbol, qty in formula:</tspan></text>
    <text x="45" y="144" fill="#94a3b8" font-family="monospace" font-size="8.5">atomic_mass = table[symbol][1]</text>
    <text x="45" y="160" fill="#94a3b8" font-family="monospace" font-size="8.5">total_mass += atomic_mass * qty</text>
    <text x="35" y="176" fill="#c084fc" font-family="monospace" font-size="8.5">return <tspan fill="#e2e8f0">round(total_mass, 4)</tspan></text>
    
    <text x="25" y="205" fill="#10b981" font-family="monospace" font-size="8.5"># Pure functions &amp; pytest coverage</text>
    <text x="25" y="222" fill="#64748b" font-family="monospace" font-size="8.5">assert compute_molar_mass(...) == 18.015</text>

    <!-- Right: Test Execution Terminal Output -->
    <rect x="270" y="44" width="225" height="212" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="282" y="65" fill="#38bdf8" font-family="monospace" font-size="9.5">$ pytest -v</text>
    <text x="282" y="85" fill="#94a3b8" font-family="monospace" font-size="8">================ test session starts ================</text>
    <text x="282" y="102" fill="#64748b" font-family="monospace" font-size="8">collected 5 items</text>
    
    <text x="282" y="124" fill="#22c55e" font-family="monospace" font-size="9">✓ test_make_periodic_table</text>
    <text x="455" y="124" fill="#22c55e" font-family="monospace" font-size="9">PASSED</text>
    
    <text x="282" y="144" fill="#22c55e" font-family="monospace" font-size="9">✓ test_parse_formula</text>
    <text x="455" y="144" fill="#22c55e" font-family="monospace" font-size="9">PASSED</text>
    
    <text x="282" y="164" fill="#22c55e" font-family="monospace" font-size="9">✓ test_compute_molar_mass</text>
    <text x="455" y="164" fill="#22c55e" font-family="monospace" font-size="9">PASSED</text>
    
    <text x="282" y="184" fill="#22c55e" font-family="monospace" font-size="9">✓ test_tire_volume_calc</text>
    <text x="455" y="184" fill="#22c55e" font-family="monospace" font-size="9">PASSED</text>

    <text x="282" y="204" fill="#22c55e" font-family="monospace" font-size="9">✓ test_receipt_csv_parser</text>
    <text x="455" y="204" fill="#22c55e" font-family="monospace" font-size="9">PASSED</text>

    <rect x="282" y="222" width="200" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="294" y="237" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="bold">5 passed in 0.14s (100%)</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(435, 335)">
    <rect width="135" height="26" rx="13" fill="#022c22" stroke="#34d399" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#34d399"/>
    <text x="27" y="17" fill="#ecfdf5" font-family="sans-serif" font-size="10" font-weight="600">BYU CSE111 Project</text>
  </g>
</svg>
