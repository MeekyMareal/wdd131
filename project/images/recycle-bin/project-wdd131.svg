<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="wdd131-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#wdd131-bg)" />

  <!-- Code ambient lines in background -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="1.5">
    <line x1="20" y1="50" x2="580" y2="50" stroke-dasharray="8 8"/>
    <line x1="20" y1="120" x2="580" y2="120" stroke-dasharray="8 8"/>
    <line x1="20" y1="190" x2="580" y2="190" stroke-dasharray="8 8"/>
    <line x1="20" y1="260" x2="580" y2="260" stroke-dasharray="8 8"/>
    <line x1="20" y1="330" x2="580" y2="330" stroke-dasharray="8 8"/>
  </g>

  <!-- Interactive Dashboard / App Window Mockup -->
  <g transform="translate(45, 35)" filter="url(#shadow2)">
    <rect width="510" height="270" rx="10" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- App Window Header -->
    <rect width="510" height="32" rx="10" fill="#18181b"/>
    <circle cx="20" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="34" cy="16" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="16" r="4.5" fill="#10b981" />
    <rect x="75" y="8" width="220" height="16" rx="5" fill="#27272a" />
    <text x="88" y="20" fill="#a1a1aa" font-family="monospace" font-size="9.5">app.js • DOM Events &amp; Storage</text>

    <!-- Side Navigation inside mockup -->
    <rect x="15" y="44" width="110" height="212" rx="6" fill="#18181b" />
    <text x="25" y="65" fill="#a1a1aa" font-family="sans-serif" font-size="9" font-weight="700">FILTERS</text>
    <rect x="23" y="75" width="94" height="20" rx="4" fill="url(#accent-indigo)"/>
    <text x="32" y="89" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="600">All Items</text>
    <rect x="23" y="102" width="94" height="20" rx="4" fill="#27272a"/>
    <text x="32" y="116" fill="#a1a1aa" font-family="sans-serif" font-size="9.5">Completed</text>
    <rect x="23" y="129" width="94" height="20" rx="4" fill="#27272a"/>
    <text x="32" y="143" fill="#a1a1aa" font-family="sans-serif" font-size="9.5">Favorites ★</text>

    <text x="25" y="185" fill="#a1a1aa" font-family="sans-serif" font-size="9" font-weight="700">STORAGE</text>
    <rect x="23" y="195" width="94" height="6" rx="3" fill="#22c55e" />
    <text x="25" y="213" fill="#71717a" font-family="sans-serif" font-size="8">localStorage: 12 entries</text>

    <!-- Main dynamic grid cards inside mockup -->
    <rect x="135" y="44" width="360" height="38" rx="6" fill="#18181b" stroke="#27272a"/>
    <text x="148" y="63" fill="#fafafa" font-family="sans-serif" font-size="11" font-weight="600">Dynamic Card Collection (DOM Rendering)</text>
    <text x="148" y="74" fill="#a1a1aa" font-family="sans-serif" font-size="8.5">Event Listeners, Template Literals, Form Validation</text>
    <rect x="425" y="52" width="60" height="20" rx="4" fill="#4f46e5"/>
    <text x="435" y="66" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">+ Add</text>

    <!-- Dynamic Card 1 -->
    <rect x="135" y="90" width="114" height="100" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <rect x="143" y="98" width="98" height="42" rx="4" fill="#27272a"/>
    <circle cx="160" cy="119" r="8" fill="#6366f1"/>
    <text x="145" y="153" fill="#fafafa" font-family="sans-serif" font-size="9.5" font-weight="600">Temple Card</text>
    <text x="145" y="165" fill="#a1a1aa" font-family="sans-serif" font-size="8">Dedicated: 1888</text>
    <rect x="145" y="172" width="45" height="12" rx="3" fill="#312e81"/>
    <text x="150" y="181" fill="#c7d2fe" font-family="sans-serif" font-size="7.5">Historic</text>

    <!-- Dynamic Card 2 -->
    <rect x="258" y="90" width="114" height="100" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <rect x="266" y="98" width="98" height="42" rx="4" fill="#27272a"/>
    <circle cx="283" cy="119" r="8" fill="#10b981"/>
    <text x="268" y="153" fill="#fafafa" font-family="sans-serif" font-size="9.5" font-weight="600">Review Form</text>
    <text x="268" y="165" fill="#a1a1aa" font-family="sans-serif" font-size="8">Counter: 42 visits</text>
    <rect x="268" y="172" width="45" height="12" rx="3" fill="#065f46"/>
    <text x="274" y="181" fill="#a7f3d0" font-family="sans-serif" font-size="7.5">Dynamic</text>

    <!-- Dynamic Card 3 -->
    <rect x="381" y="90" width="114" height="100" rx="6" fill="#18181b" stroke="#3f3f46"/>
    <rect x="389" y="98" width="98" height="42" rx="4" fill="#27272a"/>
    <circle cx="406" cy="119" r="8" fill="#f59e0b"/>
    <text x="391" y="153" fill="#fafafa" font-family="sans-serif" font-size="9.5" font-weight="600">Local Weather</text>
    <text x="391" y="165" fill="#a1a1aa" font-family="sans-serif" font-size="8">WindChill: 28°F</text>
    <rect x="391" y="172" width="45" height="12" rx="3" fill="#78350f"/>
    <text x="397" y="181" fill="#fde68a" font-family="sans-serif" font-size="7.5">Sensors</text>

    <!-- Code Preview Footer inside window -->
    <rect x="135" y="198" width="360" height="58" rx="6" fill="#121215" stroke="#27272a"/>
    <text x="145" y="213" fill="#ec4899" font-family="monospace" font-size="8.5">const <tspan fill="#38bdf8">renderList</tspan> = <tspan fill="#e4e4e7">(items) =&gt; {</tspan></text>
    <text x="155" y="226" fill="#e4e4e7" font-family="monospace" font-size="8.5">  container.<tspan fill="#38bdf8">innerHTML</tspan> = items.<tspan fill="#facc15">map</tspan>(i =&gt; <tspan fill="#4ade80">`&lt;div class="card"&gt;${i.title}&lt;/div&gt;`</tspan>).join('');</text>
    <text x="145" y="239" fill="#e4e4e7" font-family="monospace" font-size="8.5">};</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(435, 335)">
    <rect width="135" height="26" rx="13" fill="#09090b" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4" fill="#818cf8"/>
    <text x="27" y="17" fill="#f5f3ff" font-family="sans-serif" font-size="10" font-weight="600">BYU WDD131 Project</text>
  </g>
</svg>
